name: Triagem diaria de atos ANEEL CORE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/monitorar_aneel.py'
      - 'scripts/test_monitorar_aneel.py'
      - '.github/workflows/monitorar-aneel.yml'
  schedule:
    - cron: '0 12 * * 1-5'
permissions:
  contents: read
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe e filtragem dos ativos
        run: |
          python -m py_compile scripts/monitorar_aneel.py
          python -m unittest discover -s scripts -p 'test_monitorar_aneel.py' -v
      - name: Triar INLABS, fontes oficiais e noticias indexadas
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
          INLABS_LOOKBACK_DAYS: '7'
        run: python scripts/monitorar_aneel.py
      - name: Preservar relatorio mesmo quando houver falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triagem-aneel-core
          path: dados/auditoria/triagem-aneel.json
          if-no-files-found: warn
          retention-days: 30
