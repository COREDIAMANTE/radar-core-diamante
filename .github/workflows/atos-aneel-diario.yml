name: Atos ANEEL - monitor diário 10h BRT
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/monitorar_atos_aneel.py'
      - '.github/workflows/atos-aneel-diario.yml'
permissions:
  contents: write
concurrency:
  group: atos-aneel-diario
  cancel-in-progress: false
jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar cliente oficial INLABS
        run: python -m pip install requests
      - name: Verificar atos ANEEL no DOU e fontes complementares
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
        run: python scripts/monitorar_atos_aneel.py
      - name: Persistir relatório e avisos de indisponibilidade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/atos-aneel.json
          if ! git diff --cached --quiet; then
            git commit -m "Monitor ANEEL: atos do dia e status da coleta"
            git push origin HEAD:main
          fi

      - name: Validar qualidade da coleta
        run: |
          python - <<'PY'
          import json,sys
          with open('dados/atos-aneel.json',encoding='utf-8') as f: d=json.load(f)
          status=d.get('ultimo_status')
          checked=d.get('candidatos_verificados_ultima_execucao',0)
          print('Status:',status,'Atos examinados:',checked)
          if status=='inconclusivo' or not checked:
              print('ERRO: nenhuma verificação válida; não afirmar ausência de atos.')
              sys.exit(1)
          PY
